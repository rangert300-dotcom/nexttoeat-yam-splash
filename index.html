<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Next To Eat — Wholistic Culinary Market</title>
<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700&family=Abril+Fatface&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Styles -->
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/banner.css">
</head>
<body>

<!-- ===== Y.A.M. BANNER OVERLAY ===== -->
<!-- This entire block gets removed from DOM after dismiss or if localStorage says don't show -->
<div id="yam-overlay" role="dialog" aria-modal="true" aria-label="Y.A.M. Launch Announcement">
  <div id="yam-backdrop"></div>

  <div id="yam-newspaper">
    <!-- DISMISS BUTTON -->
    <button id="yam-dismiss" aria-label="Close announcement">&#x2715;</button>

    <!-- "DON'T SHOW AGAIN" CHECKBOX -->
    <label id="yam-no-repeat" class="np-no-repeat">
      <input type="checkbox" id="yam-dismiss-forever"> Don't show again
    </label>

    <!-- ====== MASTHEAD ====== -->
    <header class="np-masthead">
      <div class="np-meta-row">
        <span>Central City, New Orleans</span>
        <span>Vol. 1 &middot; No. 1</span>
      </div>

      <!-- Y.A.M. Logo -->
      <div class="np-logo-area">
        <img
          src="./assets/123_1.jpeg"
          alt="Y.A.M. — Young Adult Market"
          class="np-yam-logo"
          id="yam-logo-img"
        >
        <div class="np-yam-logo-fallback" id="yam-logo-fallback">Y.A.M.</div>
      </div>

      <!-- Masthead Title -->
      <div class="np-title">
        <span class="np-fresh">fresh</span>&nbsp;<span class="np-yam-text">Y.A.M.</span>
      </div>
      <div class="np-subtitle">Young Adult Market</div>

      <!-- Date Banner -->
      <div class="np-date-banner" id="date-banner">
        <div id="coming-soon">COMING SPRING 2026</div>
        <div id="now-open">NOW OPEN</div>
      </div>

      <div class="np-rule np-rule-double"></div>
    </header>

    <!-- ====== HEADLINE ====== -->
    <section class="np-headline">
      <h1>Y.A.M. is Next To Eat.</h1>
      <p class="np-subhead">Next To Eat's Young Adult Market Opens on Simon Bolivar</p>
    </section>

  </div>
</div>

<!-- ===== MAIN HOMEPAGE CONTENT ===== -->
<main>
  <!-- The banner is an overlay ON TOP of this — when dismissed, homepage is revealed -->
  <section style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--cream);">
    <p style="font-family:var(--font-body); color:var(--dark); font-size:1.2rem;">
      [Existing Next To Eat homepage content goes here]
    </p>
  </section>
</main>

<script src="./js/banner.js"></script>
</body>
</html>
